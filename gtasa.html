<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grand Theft Auto San Andreas - CalseGame</title>
    <link rel="icon" type="image/png" href="images/CG.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Üst Bar (Navbar) -->
    <header class="navbar">
        <div class="logo">
            <a href="index.html" class="logo-text">
                <img src="images/CG.png" alt="CalseGame Logo" class="nav-logo-img">
                <span class="logo-text"></span>
                    <span class="brand-calse">Calse</span><span class="brand-game">Game</span>
                    <style>
                      .brand-game {
                          margin-left: 4px !important; 
        }
                   </style>
                </span>
            </a>
        </div>
        <div class="nav-auth">
            <a href="#" class="btn-auth btn-login">Oturum Aç</a>
            <a href="#" class="btn-auth btn-register">Kayıt Ol</a>
        </div>
    </header>

    <!-- Ana İçerik -->
    <main class="container">
        <div class="game-detail-header">
            <h1>Grand Theft Auto San Andreas</h1>
            <p>Lütfen devam etmek istediğiniz kategoriyi seçin.</p>
        </div>

        <div class="options-grid">
            <!-- OYUN KARTI (İndirme Sayfasına Gider) -->
            <a href="gtasa-game.html" class="option-card">
                <div class="option-icon">🎮</div>
                <h2>Oyun</h2>
                <p>GTA San Andreas orjinal/full sürümünü indirin.</p>
            </a>

            <!-- MODLAR KARTI -->
            <a href="#" class="option-card">
                <div class="option-icon">🛠️</div>
                <h2>Modlar</h2>
                <p>Araba, grafik ve en popüler yamaları keşfedin.</p>
            </a>
        </div>
    </main>

    <!-- Modallar ve Script -->
    <div id="loginModal" class="modal">
        <div class="modal-content">
            <span class="modal-close">&times;</span>
            <h2>Oturum Aç</h2>
            <form class="auth-form">
                <input type="text" placeholder="Kullanıcı Adı veya İsim" required>
                <input type="password" placeholder="Şifre" required>
                <button type="submit" class="btn-submit">Giriş Yap</button>
            </form>
            <div class="divider">veya</div>
            <button class="btn-google">
                <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google"> Google ile Giriş Yap
            </button>
        </div>
    </div>

    <div id="registerModal" class="modal">
        <div class="modal-content">
            <span class="modal-close">&times;</span>
            <h2>Kayıt Ol</h2>
            <form class="auth-form">
                <input type="text" placeholder="İsim" required>
                <input type="email" placeholder="Gmail / E-posta" required>
                <input type="password" placeholder="Şifre" required>
                <button type="submit" class="btn-submit">Kayıt Ol</button>
            </form>
            <div class="divider">veya</div>
            <button class="btn-google">
                <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google"> Google ile Kayıt Ol
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
