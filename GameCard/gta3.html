<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grand Theft Auto:  III - CalseGame</title>
    <link rel="icon" type="image/png" href="../images/CG.png">
    <link rel="stylesheet" href="../style.css">
</head>
<body>

    <!-- Header -->
    <header class="navbar">
    <div style="display: flex; align-items: center; gap: 30px;">
        <!-- Logo -->
        <div class="logo">
            <a href="../index.html" class="logo-text">
                <img src="../images/CG.png" alt="CalseGame Logo" class="nav-logo-img">
                <span class="logo-words">
                    <span class="brand-calse">CALSE</span>
                    <span class="brand-game">GAME</span>
                </span>
            </a>
        </div>

        <!-- Tek ve Düzgün Menü -->
        <nav class="nav-links" style="display: flex; gap: 0; background: rgba(0,0,0,0.2); border-radius: 6px; overflow: hidden; border: 1px solid rgba(255,255,255,0.1);">
            <a href="../index.html" style="color: white; text-decoration: none; font-weight: 500; padding: 8px 16px; border-right: 1px solid rgba(255,255,255,0.1); transition: all 0.3s ease;">Ana Sayfa</a>
            <a href="../index.html?cat=pc" style="color: #ddd; text-decoration: none; font-weight: 500; padding: 8px 16px; border-right: 1px solid rgba(255,255,255,0.1); transition: all 0.3s ease;">PC Oyunları</a>
            <a href="../index.html?cat=mobil" style="color: #ddd; text-decoration: none; font-weight: 500; padding: 8px 16px; transition: all 0.3s ease;">Mobil Oyunlar</a>
        </nav>
    </div>

    <!-- Sağ Üst Butonlar -->
    <div class="nav-auth">
        <a href="#" class="btn-auth btn-login">Oturum Aç</a>
        <a href="#" class="btn-auth btn-register">Kayıt Ol</a>
    </div>
</header>

    <!-- Detay İçerik -->
    <main class="container">
        <div class="game-detail-header">
            <h1>Grand Theft Auto:  III</h1>
            <p>İstediğiniz kategoriyi seçerek devam edin.</p>
        </div>

        <!-- Seçenek Kartları -->
        <section class="options-grid">
            <a href="#" class="option-card">
                <div class="option-icon">🎮</div>
                <h2>Oyun</h2>
                <p>Oyun indirme bağlantıları ve kurulum detayları.</p>
            </a>

            <a href="#" class="option-card">
                <div class="option-icon">🧩</div>
                <h2>Modlar</h2>
                <p>Araba, grafik ve Türkçe yama modları.</p>
            </a>
        </section>
    </main>
    <!-- Modallar ve Script -->
    <div id="loginModal" class="modal">
        <div class="modal-content">
            <span class="modal-close">&times;</span>
            <h2>Oturum Aç</h2>
            <form class="auth-form">
                <input type="text" placeholder="Kullanıcı Adı veya İsim" required>
                <input type="password" placeholder="Şifre" required>
                <button type="submit" class="btn-submit">Giriş Yap</button>
            </form>
            <div class="divider">veya</div>
            <button class="btn-google">
                <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google"> Google ile Giriş Yap
            </button>
        </div>
    </div>

    <div id="registerModal" class="modal">
        <div class="modal-content">
            <span class="modal-close">&times;</span>
            <h2>Kayıt Ol</h2>
            <form class="auth-form">
                <input type="text" placeholder="İsim" required>
                <input type="email" placeholder="Gmail / E-posta" required>
                <input type="password" placeholder="Şifre" required>
                <button type="submit" class="btn-submit">Kayıt Ol</button>
            </form>
            <div class="divider">veya</div>
            <button class="btn-google">
                <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google"> Google ile Kayıt Ol
            </button>
        </div>
    </div>
    <script src="../script.js"></script>
</body>
</html>
