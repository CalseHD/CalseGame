<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CalseGame</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Üst Bar (Navbar) -->
    <header class="navbar">
        <div class="logo">
            <a href="index.html" style="text-decoration: none;">
                <span class="logo-text">
                    <span class="brand-calse">Calse</span><span class="brand-game">Game</span>
                </span>
            </a>
        </div>


        <div class="nav-auth">
            <a href="#" class="btn-auth btn-login">Oturum Aç</a>
            <a href="#" class="btn-auth btn-register">Kayıt Ol</a>
        </div>
    </header>
    


    <!-- Ana İçerik -->
    <main class="container">

        <!-- Arama Kutusu -->
        <div class="search-box">
            <input type="text" placeholder="Oyun ara...">
        </div>

        <!-- Oyun Kartları Listesi -->
        <section class="games-grid">
            
            <!-- GTA 5 -->
            <a href="gta5.html" class="game-card">
                <div class="card-image">
                    <img src="images/gta5.png" alt="GTA 5">
                </div>
                <div class="card-info">
                    <h3>GTA 5</h3>
                    <p class="stats">🎮 1.2M Oyuncu</p>
                </div>
            </a>

            <!-- GTA 4 -->
            <a href="gta4.html" class="game-card">
                <div class="card-image">
                    <img src="images/gta4.png" alt="GTA 4">
                </div>
                <div class="card-info">
                    <h3>GTA 4</h3>
                    <p class="stats">🎮 450K Oyuncu</p>
                </div>
            </a>

            <!-- GTA San Andreas -->
            <a href="gtasa.html" class="game-card">
                <div class="card-image">
                    <img src="images/GtaSanAndreas.png" alt="GTA San Andreas">
                </div>
                <div class="card-info">
                    <h3>GTA San Andreas</h3>
                    <p class="stats">🎮 890K Oyuncu</p>
                </div>
            </a>

            <!-- GTA Vice City -->
            <a href="gtavc.html" class="game-card">
                <div class="card-image">
                    <img src="images/GtaViceCity.png" alt="GTA Vice City">
                </div>
                <div class="card-info">
                    <h3>GTA Vice City</h3>
                    <p class="stats">🎮 320K Oyuncu</p>
                </div>
            </a>

            <!-- GTA 3 -->
            <a href="gta3.html" class="game-card">
                <div class="card-image">
                    <img src="images/gta3.png" alt="GTA 3">
                </div>
                <div class="card-info">
                    <h3>GTA 3</h3>
                    <p class="stats">🎮 150K Oyuncu</p>
                </div>
            </a>

        </section>

    </main>

</body>
</html>
