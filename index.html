<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=2.0">
    <title>CalseGame</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Üst Menü (Header) -->
    <header class="navbar">
        <div class="logo">
            <span class="logo-text">CalseGame</span>
        </div>
    </header>

    <!-- Ana İçerik Alanı -->
    <main class="container">
        <!-- Hero Başlık Alanı -->
        <section class="hero">
            <h1>Efsanevi Oyunları Keşfedin</h1>
            <p>Favori oyunlarınız için içerikleri bulun ve hemen oynamaya başlayın.</p>
        </section>

        <!-- Arama Çubuğu -->
        <div class="search-box">
            <input type="text" placeholder="Bir oyun ara...">
            <button class="search-btn">🔍</button>
        </div>

        <!-- Oyun Kartları Grid Alanı -->
        <section class="games-grid">
            
            <div class="game-card">
                <div class="card-image">
                    <img src="images/gta5.png" alt="GTA 5">
                </div>
                <div class="card-info">
                    <h3>GTA 5</h3>
                    <p class="stats">🎮 1.2M Oyuncu</p>
                </div>
            </div>

            <div class="game-card">
                <div class="card-image">
                    <img src="images/gta4.png" alt="GTA 4">
                </div>
                <div class="card-info">
                    <h3>GTA 4</h3>
                    <p class="stats">🎮 450K Oyuncu</p>
                </div>
            </div>

            <div class="game-card">
                <div class="card-image">
                    <img src="images/GtaSanAndreas.png" alt="GTA San Andreas">
                </div>
                <div class="card-info">
                    <h3>GTA San Andreas</h3>
                    <p class="stats">🎮 890K Oyuncu</p>
                </div>
            </div>

            <div class="game-card">
                <div class="card-image">
                    <img src="images/GtaViceCity.png" alt="GTA Vice City">
                </div>
                <div class="card-info">
                    <h3>GTA Vice City</h3>
                    <p class="stats">🎮 320K Oyuncu</p>
                </div>
            </div>

            <div class="game-card">
                <div class="card-image">
                    <img src="images/gta3.png" alt="GTA 3">
                </div>
                <div class="card-info">
                    <h3>GTA 3</h3>
                    <p class="stats">🎮 150K Oyuncu</p>
                </div>
            </div>

        </section>
    </main>

</body>
</html>
